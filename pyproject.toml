[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-stitching-claim-audit"
version = "0.1.0"
description = "Offline deterministic documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
image-stitching-claim-audit = "image_stitching_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["image_stitching_claim_audit*"]
